<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIRCUIT FORGE // 像素电路生成器</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2fd6;--blue:#00e5ff;--purple:#bf5aff;--green:#00ff9c;--yellow:#ffe600;--bg:#000005;--white:#e8e8ff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--white);font-family:'VT323',monospace;font-size:20px;min-height:100vh;}
.crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:3px solid var(--purple);box-shadow:0 0 20px rgba(191,90,255,.3);}
.back{font-family:'Press Start 2P';font-size:9px;color:var(--blue);text-decoration:none;border:3px solid var(--blue);padding:9px 12px;text-shadow:0 0 6px var(--blue);transition:all .1s steps(3);}
.back:hover{background:var(--blue);color:#000;box-shadow:0 0 20px rgba(0,229,255,.9);}
.title{font-family:'Press Start 2P';font-size:11px;color:var(--green);text-shadow:0 0 10px var(--green);letter-spacing:2px;}
.wrap{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:26px;padding:26px 18px;max-width:1080px;margin:0 auto;}
.canvas-side{display:flex;flex-direction:column;align-items:center;gap:12px;}
#board{
  border:4px solid var(--green);
  box-shadow:0 0 0 4px rgba(0,0,0,.9),0 0 30px rgba(0,255,156,.4),inset 0 0 16px rgba(0,255,156,.08);
  image-rendering:pixelated;background:#04040f;max-width:100%;height:auto;aspect-ratio:1/1;
}
.size-hint{font-family:'VT323';color:var(--dim);font-size:17px;}
.panel{
  width:290px;background:#050510;border:3px solid var(--blue);
  box-shadow:0 0 24px rgba(0,229,255,.25);padding:18px;
}
.panel h3{font-family:'Press Start 2P';font-size:9px;color:var(--blue);text-shadow:0 0 8px var(--blue);margin-bottom:14px;letter-spacing:1px;}
.field{margin-bottom:12px;}
.field label{font-family:'Press Start 2P';font-size:7px;color:var(--dim);display:block;margin-bottom:5px;letter-spacing:1px;}
.field label .val{color:var(--green);float:right;font-size:12px;}
.field input[type=range]{width:100%;accent-color:var(--blue);}
.theme-row{display:flex;gap:8px;margin-bottom:12px;}
.theme-btn{flex:1;font-family:'Press Start 2P';font-size:8px;color:var(--green);background:none;border:2px solid var(--green);padding:9px 4px;cursor:pointer;text-shadow:0 0 6px var(--green);transition:all .08s steps(2);}
.theme-btn.on{background:var(--green);color:#000;}
.theme-btn.t1{color:var(--blue);border-color:var(--blue);text-shadow:0 0 6px var(--blue);}
.theme-btn.t1.on{background:var(--blue);color:#000;}
.theme-btn.t2{color:var(--pink);border-color:var(--pink);text-shadow:0 0 6px var(--pink);}
.theme-btn.t2.on{background:var(--pink);color:#000;}
.theme-btn.t3{color:var(--purple);border-color:var(--purple);text-shadow:0 0 6px var(--purple);}
.theme-btn.t3.on{background:var(--purple);color:#000;}
.row2{display:flex;gap:8px;}
.row2 button{flex:1;font-family:'Press Start 2P';font-size:8px;color:var(--yellow);background:none;border:2px solid var(--yellow);padding:10px 6px;cursor:pointer;text-shadow:0 0 6px var(--yellow);transition:all .08s steps(2);}
.row2 button:hover{background:var(--yellow);color:#000;}
.row2 button.g{color:var(--pink);border-color:var(--pink);text-shadow:0 0 6px var(--pink);}
.row2 button.g:hover{background:var(--pink);color:#000;}
.export-row{display:flex;gap:8px;margin-top:10px;}
.export-row button{flex:1;font-family:'Press Start 2P';font-size:8px;color:var(--green);background:none;border:2px solid var(--green);padding:10px 6px;cursor:pointer;text-shadow:0 0 6px var(--green);transition:all .08s steps(2);}
.export-row button:hover{background:var(--green);color:#000;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:99;background:#050510;color:var(--green);font-family:'Press Start 2P';font-size:9px;border:2px solid var(--green);padding:11px 20px;box-shadow:0 0 24px rgba(0,255,156,.5);opacity:0;pointer-events:none;transition:opacity .2s;text-shadow:0 0 8px var(--green);}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div class="crt"></div>
<div class="topbar">
  <a class="back" href="../index.html">◀ BACK</a>
  <div class="title">CIRCUIT FORGE</div>
</div>
<div class="wrap">
  <div class="canvas-side">
    <canvas id="board" width="512" height="512"></canvas>
    <div class="size-hint">512 × 512 · 点击「重新生成」换一版电路</div>
  </div>
  <div class="panel">
    <h3>// 参数 PARAMS</h3>
    <div class="theme-row" id="theme-row">
      <button class="theme-btn on">青绿</button>
      <button class="theme-btn t1">电蓝</button>
      <button class="theme-btn t2">霓粉</button>
      <button class="theme-btn t3">荧光紫</button>
    </div>
    <div class="field">
      <label>走线密度 <span class="val" id="v-density">45</span></label>
      <input type="range" id="density" min="10" max="90" value="45">
    </div>
    <div class="field">
      <label>网格大小 <span class="val" id="v-grid">16</span></label>
      <input type="range" id="grid" min="8" max="32" value="16" step="4">
    </div>
    <div class="field">
      <label>节点数量 <span class="val" id="v-nodes">14</span></label>
      <input type="range" id="nodes" min="4" max="30" value="14">
    </div>
    <div class="row2">
      <button onclick="generate()">重新生成</button>
      <button class="g" onclick="randomize()">随机参数</button>
    </div>
    <div class="export-row">
      <button onclick="exportPNG()">导出 PNG</button>
      <button onclick="copySeed()">复制种子</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const cv = document.getElementById('board');
const ctx = cv.getContext('2d');
const SIZE = 512;

const THEMES = [
  { line:'#00ff9c', node:'#00e5ff', pad:'#e8e8ff', bg:'#03130b' },
  { line:'#00e5ff', node:'#bf5aff', pad:'#e8e8ff', bg:'#031016' },
  { line:'#ff2fd6', node:'#00e5ff', pad:'#ff77e6', bg:'#15030f' },
  { line:'#bf5aff', node:'#ff2fd6', pad:'#d9a8ff', bg:'#0d0315' }
];
let themeIdx = 0;

function mulberry(seed){
  let s = seed>>>0;
  return function(){
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s>>>15, 1 | s);
    t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t;
    return ((t ^ t>>>14)>>>0) / 4294967296;
  };
}
function seeded(seed){
  const r = mulberry(seed);
  const grid = 16, density = 45, nodes = 14;
  const theme = THEMES[0];
  drawCircuit(r, grid, density, nodes, theme);
}

function drawCircuit(rand, grid, density, nodes, theme){
  ctx.fillStyle = theme.bg;
  ctx.fillRect(0,0,SIZE,SIZE);
  const cols = SIZE/grid, rows = SIZE/grid;
  // 背景网格
  ctx.strokeStyle = theme.line; ctx.globalAlpha = .07; ctx.lineWidth = 1;
  for(let x=0;x<=SIZE;x+=grid){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,SIZE); ctx.stroke(); }
  for(let y=0;y<=SIZE;y+=grid){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(SIZE,y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // 走线：曼哈顿路径
  ctx.strokeStyle = theme.line; ctx.globalAlpha = .55; ctx.lineWidth = 1.5;
  const traces = Math.floor((density/90) * (cols*rows) * .5);
  for(let i=0;i<traces;i++){
    let x = Math.floor(rand()*cols)*grid + grid/2;
    let y = Math.floor(rand()*rows)*grid + grid/2;
    const len = 2 + Math.floor(rand()*6);
    for(let s=0;s<len;s++){
      const dir = Math.floor(rand()*4);
      let nx = x, ny = y;
      if(dir===0) ny -= grid; else if(dir===1) ny += grid; else if(dir===2) nx -= grid; else nx += grid;
      if(nx<0||ny<0||nx>SIZE||ny>SIZE) break;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); ctx.stroke();
      x = nx; y = ny;
    }
  }
  ctx.globalAlpha = 1;

  // 焊盘节点
  for(let i=0;i<nodes;i++){
    const x = Math.floor(rand()*cols)*grid + grid/2;
    const y = Math.floor(rand()*rows)*grid + grid/2;
    const r = 3 + Math.floor(rand()*4);
    // 外圈
    ctx.fillStyle = theme.node; ctx.globalAlpha = .9;
    ctx.beginPath(); ctx.arc(x,y,r+2,0,Math.PI*2); ctx.fill();
    // 内孔
    ctx.fillStyle = theme.bg; ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(x,y,r-1,0,Math.PI*2); ctx.fill();
    // 亮点
    ctx.fillStyle = theme.pad; ctx.globalAlpha = .9;
    ctx.fillRect(x-1,y-1,2,2);
  }
  ctx.globalAlpha = 1;

  // 随机发光点
  for(let i=0;i<30;i++){
    const x = Math.floor(rand()*cols)*grid;
    const y = Math.floor(rand()*rows)*grid;
    ctx.fillStyle = theme.node; ctx.globalAlpha = .25 + rand()*.3;
    ctx.fillRect(x,y,2,2);
  }
  ctx.globalAlpha = 1;
}

function generate(){
  const seed = (Math.random()*1e9)>>>0;
  const grid = +document.getElementById('grid').value;
  const density = +document.getElementById('density').value;
  const nodes = +document.getElementById('nodes').value;
  drawCircuit(mulberry(seed), grid, density, nodes, THEMES[themeIdx]);
  lastSeed = seed;
}
let lastSeed = 12345;

function randomize(){
  const g = document.getElementById('grid');
  const d = document.getElementById('density');
  const n = document.getElementById('nodes');
  g.value = [8,12,16,20,24,28,32][Math.floor(Math.random()*7)];
  d.value = 10 + Math.floor(Math.random()*81);
  n.value = 4 + Math.floor(Math.random()*27);
  document.getElementById('v-grid').textContent = g.value;
  document.getElementById('v-density').textContent = d.value;
  document.getElementById('v-nodes').textContent = n.value;
  generate();
  toast('参数已随机化');
}
function exportPNG(){
  const a = document.createElement('a');
  a.download = 'circuit-board.png';
  a.href = cv.toDataURL('image/png');
  a.click();
  toast('PNG 已导出');
}
function copySeed(){
  if(navigator.clipboard){
    navigator.clipboard.writeText(String(lastSeed)).then(()=>toast('种子已复制: '+lastSeed), ()=>toast('种子: '+lastSeed));
  }else toast('种子: '+lastSeed);
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = '// ' + msg + ' //';
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm = setTimeout(()=>t.classList.remove('show'), 1600);
}

document.getElementById('density').addEventListener('input', e=>{ document.getElementById('v-density').textContent = e.target.value; generate(); });
document.getElementById('grid').addEventListener('input', e=>{ document.getElementById('v-grid').textContent = e.target.value; generate(); });
document.getElementById('nodes').addEventListener('input', e=>{ document.getElementById('v-nodes').textContent = e.target.value; generate(); });
document.querySelectorAll('.theme-btn').forEach((b,i)=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.theme-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    themeIdx = i;
    generate();
  });
});

generate();
</script>
</body>
</html>
